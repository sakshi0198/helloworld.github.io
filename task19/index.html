<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Service Booking App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Logo
            </div>

            <ul class="menu">

                <li><a href="#">Home</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact Us</a></li>
                <li><a href="#">About Us</a></li>

            </ul>

            <div class="user">

                Username

            </div>

        </nav>

    </header>

    <!-- ================= MAIN SECTION ================= -->

    <div class="container">

        <!-- ================= LEFT SIDE ================= -->

        <div class="left">

            <!-- Added Items -->

            <div class="card">

                <h2>Added Items</h2>
                <table>
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Service Name</th>
                            <th>Price</th>
                        </tr>
                    </thead>

                    <tbody id="cartTable">
                        <tr id="emptyRow">
                            <td colspan="3">
                                No Items Added
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="total">
                    <h3>Total Amount</h3>
                    <h3 id="totalPrice">
                        ₹0
                    </h3>
                </div>
            </div>

            <!-- Booking Form -->

            <div class="card">
                <h2>Book Now</h2>
                <form id="bookingForm">
                    <label>
                        Full Name
                    </label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter Name">
                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email">
                    <label>
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter Phone Number">

                    <!-- Password Field -->

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password">

                    <!-- Separate Add to Cart Button -->

                    <button
                        type="button"
                        id="cartButton">
                        Add To Cart

                    </button>

                    <!-- Book Button -->

                    <button
                        type="submit"
                        id="bookButton">
                        Book Now
                    </button>
                </form>
            </div>
        </div>

        <!-- ================= RIGHT SIDE ================= -->

        <div class="right">
            <div class="card">
                <h2>
                    Browse Our Services
                </h2>

                <p>
                    Select a service and add it to the cart.
                </p>
                <hr>
                <!-- Service Image -->
                <img
                    id="serviceImage"
                    src="../task19/images/dry.png">
                <!-- Service Name -->
                <h2 id="serviceName">
                    Dry Cleaning
                </h2>

                <!-- Service Price -->
                <h3 id="servicePrice">
                    ₹200
                </h3>

                <!-- Service Buttons -->

                <div class="buttons">
                    <button
                        type="button"
                        id="skipButton">
                        Skip Item
                    </button>

                    <button
                        type="button"
                        id="nextCartButton">
                        Add Item
                    </button>

                </div>
                <hr>
                <p>
                    Add the services to your cart and complete the booking.
                </p>

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
