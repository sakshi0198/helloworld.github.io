<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Workspace</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="bg-white">

    <!-- ================= NAVBAR ================= -->

    <nav class="sticky top-0 z-50 bg-white border-b">

        <div class="max-w-7xl mx-auto flex justify-between items-center px-8 py-4">

            <!-- Logo -->
            <div class="flex items-center gap-2 text-2xl font-bold">
                ✦ <span>Project</span>
            </div>

            <!-- Menu -->
            <div class="hidden md:flex items-center gap-8">

                <a href="#" class="text-gray-600 hover:text-black">
                    Product
                </a>

                <a href="#" class="text-gray-600 hover:text-black">
                    Solutions
                </a>

                <a href="#" class="text-gray-600 hover:text-black">
                    Resources
                </a>

                <a href="#" class="text-gray-600 hover:text-black">
                    Pricing
                </a>

                <a href="#" class="font-semibold">
                    Log in
                </a>

                <button class="bg-slate-900 text-white px-5 py-3 rounded">
                    Get AI free
                </button>

            </div>

            <!-- Mobile Menu Icon -->
            <div class="md:hidden text-3xl">
                ☰
            </div>

        </div>

    </nav>



    <!-- ================= HERO SECTION ================= -->

    <section
    class="relative min-h-screen bg-gradient-to-b from-orange-50 via-white to-white overflow-hidden">

        <div
        class="max-w-7xl mx-auto text-center pt-16 px-6 relative">

            <!-- Heading -->

            <h1
            class="text-5xl md:text-7xl font-bold text-slate-900 leading-tight">

                Write, plan, share.
                <br>
                With AI at your side.

            </h1>


            <!-- Description -->

            <p
            class="text-gray-600 text-xl mt-8 max-w-3xl mx-auto">

                It is the connected workspace where better,
                faster work happens. Now with AI.

            </p>


            <!-- CTA Buttons -->

            <div
            class="relative flex justify-center mt-10 h-16">

                <button
                class="bg-slate-900 text-white px-10 py-4 font-semibold rounded absolute left-1/2 -translate-x-28">

                    Get AI free →

                </button>

                <button
                class="bg-blue-600 text-white px-10 py-4 font-semibold rounded absolute left-1/2 translate-x-2">

                    Request a demo

                </button>

            </div>



            <!-- Dashboard Preview -->

            <div class="relative mt-20 flex justify-center">

                <img

                src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?w=700"

                class="w-[420px] rounded shadow-lg z-10"

                alt="Dashboard">


                <!-- Tasks Card -->

                <div
                class="absolute left-0 top-16 bg-white p-5 rounded-lg shadow-xl w-48 text-left z-20">

                    <div class="flex items-center gap-3">

                        <div
                        class="bg-purple-100 text-purple-700 p-2 rounded">

                            📋

                        </div>

                        <div>

                            <h3 class="font-bold">

                                Tasks

                            </h3>

                            <p class="text-gray-500 text-sm">

                                12 tasks completed today

                            </p>

                        </div>

                    </div>

                </div>



                <!-- Project Status -->

                <div
                class="absolute right-0 top-5 bg-white p-5 rounded-lg shadow-xl w-52 text-left z-20">

                    <div class="flex gap-3">

                        <div
                        class="bg-green-100 text-green-600 p-2 rounded">

                            ✔

                        </div>

                        <div>

                            <h3 class="font-bold">

                                Project Status

                            </h3>

                            <p
                            class="text-green-600 font-semibold">

                                On Track

                            </p>

                        </div>

                    </div>

                </div>



                <!-- Team Activity -->

                <div
                class="absolute right-10 bottom-0 bg-white p-5 rounded-lg shadow-xl w-56 text-left z-20">

                    <h3 class="font-bold mb-3">

                        Team Activity

                    </h3>

                    <div class="flex items-center">

                        <img
                        src="https://randomuser.me/api/portraits/men/31.jpg"
                        class="w-8 h-8 rounded-full border-2 border-white">

                        <img
                        src="https://randomuser.me/api/portraits/women/44.jpg"
                        class="w-8 h-8 rounded-full border-2 border-white -ml-3">

                        <img
                        src="https://randomuser.me/api/portraits/men/55.jpg"
                        class="w-8 h-8 rounded-full border-2 border-white -ml-3">

                        <span class="ml-3 text-gray-500">

                            +5 online

                        </span>

                    </div>

                </div>

            </div>

        </div>

    </section>



    <!-- ================= CHAT BUTTON ================= -->

    <button
    class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white w-14 h-14 rounded shadow-lg hover:scale-110 transition">

        💬

    </button>

</body>
</html>
